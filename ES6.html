    // default param
    function divide(a,b, rounded=false){
        let result = (a/b)
        if(rounded===true){
            return Math.round()
        }
        return result
    }

    let result1 = divide(10,3, true)
    let result2 = divide(10,3)
    console.log(result1, result2)

    // spread operator
    function flexibleAdd(...nums){
        let total = 0
        for(let value of nums){
            total += value
        }
        return total

    }
    console.log(flexibleAdd(29, 67, 45, 73, 467))

    let people = ["Leslie", "Glorian", "Dec"]
